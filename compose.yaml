services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-IntelliShop}
      DB_USERNAME: ${DB_USERNAME:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-local_dev_password}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_password}
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - sh
      - -lc
      - |
        if [ ! -f .env ]; then cp .env.example .env; fi
        mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache bootstrap/cache
        chmod -R 777 storage bootstrap/cache 2>/dev/null || true
        if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist; fi
        if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi
        php artisan storage:link --quiet 2>/dev/null || true
        echo "Waiting for MySQL database connection..."
        until php -r "try { new PDO('mysql:host=mysql;port=3306;dbname=' . getenv('DB_DATABASE'), getenv('DB_USERNAME'), getenv('DB_PASSWORD')); exit(0); } catch (\Throwable) { exit(1); }"; do
          sleep 1
        done
        php -r "try { (new PDO('mysql:host=mysql;port=3306', 'root', getenv('DB_ROOT_PASSWORD')))->query('CREATE DATABASE IF NOT EXISTS ' . getenv('DB_DATABASE') . '_testing; GRANT ALL PRIVILEGES ON ' . getenv('DB_DATABASE') . '_testing.* TO \'' . getenv('DB_USERNAME') . '\'@\'%\'; FLUSH PRIVILEGES;'); } catch (\Throwable) {}"
        echo "Database connected. Running migrations and seeders..."
        php artisan migrate --force
        php artisan db:seed --force
        echo ""
        echo "=========================================================="
        echo "  IntelliShop Ready!"
        echo "  Website:     http://localhost:8000"
        echo "  Login:       http://localhost:8000/login"
        echo "  phpMyAdmin:  http://localhost:8080"
        echo "  MySQL:       127.0.0.1:3306 (DB: IntelliShop)"
        echo ""
        php artisan serve --host=0.0.0.0 --port=8000

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-IntelliShop}
      MYSQL_USER: ${DB_USERNAME:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local_dev_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_password}
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  vendor:
