name: CI/CD Pipeline

on:
  push:
    branches: [dev, main, 'feature/**', 'fix/**']
  pull_request:
    branches: [dev, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: intellishop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: intellishop
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath
          coverage: none

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Configure Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Prepare Laravel runtime directories
        run: mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views bootstrap/cache

      - name: Create dedicated test database
        run: mysql --host=127.0.0.1 --user=root --password=root --execute="CREATE DATABASE IntelliShop_testing;"

      - name: Migrate and seed application database
        run: php artisan migrate:fresh --seed --force

      - name: Migrate and seed test database
        run: php artisan migrate:fresh --seed --force
        env:
          DB_DATABASE: IntelliShop_testing

      - name: Run PHPUnit / Pest Test Suite
        run: php artisan test

      - name: Run Python Analytics Service Test Suite
        run: PYTHONPATH=analytics-service python3 -m unittest discover -s analytics-service/tests

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Assets (Vite)
        run: npm run build
